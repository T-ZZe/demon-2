    item:
      material: AMETHYST_SHARD
      name: "&e&lCristal de Foudre"
      lore:
        - "&7Il crépite à votre contact."
    contracts:
      lightning_strike:
        power: LIGHTNING_STRIKE
        costs: [{type: HEADS, amount: 3}]
        side-effects:
          - "&7Vous devez ramener des têtes authentiques."
