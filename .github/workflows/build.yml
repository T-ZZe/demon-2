name: Build DemonPact
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: DemonPact/pom.xml
      - name: Compilation
        working-directory: DemonPact
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: DemonPact
          path: DemonPact/target/DemonPact.jar
